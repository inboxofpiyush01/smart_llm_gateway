apiVersion: apps/v1
kind: Deployment
metadata:
  name: smart-llm-gateway
  labels:
    app.kubernetes.io/name: smart-llm-gateway
    app.kubernetes.io/managed-by: anycloud-studio
spec:
  replicas: 1
  selector:
    matchLabels:
      app: smart-llm-gateway
  template:
    metadata:
      labels:
        app: smart-llm-gateway
        app.kubernetes.io/name: smart-llm-gateway
    spec:
      containers:
        - name: smart-llm-gateway
          image: piyushdocker90/smart-llm-gateway:latest
          imagePullPolicy: Always
          env:
            - name: PORT
              value: "8501"
          ports:
            - name: http
              containerPort: 8501
              protocol: TCP
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 12
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 6
